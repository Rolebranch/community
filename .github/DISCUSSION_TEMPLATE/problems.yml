title: "[Problem] "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry something went wrong. A few checks first:

        - Is Rolebranch down right now? See [rolebranch.com/status](https://rolebranch.com/status).
        - Is there a guide for it? Many import, sign-in and PDF problems are answered in the [Help centre](https://rolebranch.com/help) and the [Help guides](https://github.com/Rolebranch/community/discussions/categories/help-guides).
        - Did someone report it already? [Search the Problems](https://github.com/Rolebranch/community/discussions/categories/problems) and upvote theirs.

        **This post is public.** Don't paste your CV, your email or anything from your account. If we need a file or your account to look into it, we'll ask you to send it privately through [rolebranch.com/help/request](https://rolebranch.com/help/request). Security issues go to [rolebranch.com/security](https://rolebranch.com/security), not here.
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Signing in
        - Importing a CV
        - Master CV and the editor
        - Templates and the PDF download
        - Tailoring with Romy
        - Cover letters
        - Reading a job posting from a link
        - Applications board and reminders
        - Interview prep and practice
        - Credits or a coupon
        - Connectors (ChatGPT, Claude, Le Chat, other AI apps)
        - Emails from Rolebranch
        - Account, settings or export
        - The website (rolebranch.com)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and the exact message if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: The steps that lead to it, one per line.
      placeholder: |
        1. Open an application
        2. Choose Tailor CV
        3. ...
  - type: dropdown
    id: frequency
    attributes:
      label: Does it happen every time?
      options:
        - Every time
        - Sometimes
        - It happened once
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. MacBook, Chrome 141 / iPhone, the installed app / Windows, Edge"
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: Date and roughly what time, with your time zone, so we can find it in our logs.
      placeholder: "e.g. 30 Oct, around 14:20 CET"
  - type: input
    id: version
    attributes:
      label: Rolebranch version (if you know it)
      description: Shown at the foot of Settings › Account.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Crop or blur your name, contact details and CV text first.
